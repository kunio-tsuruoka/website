name: Publish data-company-learning-sensor to microCMS

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-data-company-learning-sensor.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Publish and verify the column
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          node <<'NODE'
          const zlib = require('node:zlib');

          const endpoint = 'columns';
          const contentId = 'data-company-learning-sensor';
          const expectedTitle = 'データは、会社が現実から学ぶためのセンサーだ';
          const expectedPhrase = 'BigQueryやDatabricksへ接続するのは、アプリの本番データベース';
          const payloadGzipBase64 = '';
          const fields = JSON.parse(
            zlib.gunzipSync(Buffer.from(payloadGzipBase64, 'base64')).toString('utf8')
          );

          const serviceDomain = process.env.MICROCMS_SERVICE_DOMAIN;
          const apiKey = process.env.MICROCMS_API_KEY;
          if (!serviceDomain || !apiKey) {
            throw new Error('MICROCMS_SERVICE_DOMAIN and MICROCMS_API_KEY are required');
          }
          if (fields.title !== expectedTitle || !String(fields.content).includes(expectedPhrase)) {
            throw new Error('Publication payload failed its identity checks');
          }

          const contentUrl = `https://${serviceDomain}.microcms.io/api/v1/${endpoint}/${contentId}`;
          const managementUrl = `https://${serviceDomain}.microcms-management.io/api/v1/contents/${endpoint}/${contentId}`;
          const headers = {
            'X-MICROCMS-API-KEY': apiKey,
            'Content-Type': 'application/json',
          };

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            const text = await response.text();
            let body = text;
            try { body = text ? JSON.parse(text) : null; } catch {}
            return { response, body };
          }

          function formatError(label, result) {
            return `${label}: ${result.response.status} ${result.response.statusText} ${JSON.stringify(result.body)}`;
          }

          async function managementStatus() {
            const result = await request(managementUrl, { method: 'GET' });
            if (!result.response.ok) throw new Error(formatError('Management API status lookup failed', result));
            const values = Array.isArray(result.body?.status) ? result.body.status : [result.body?.status].filter(Boolean);
            return values;
          }

          async function patchPublished() {
            const result = await request(contentUrl, {
              method: 'PATCH',
              body: JSON.stringify(fields),
            });
            if (!result.response.ok) throw new Error(formatError('Published-content PATCH failed', result));
          }

          async function publishDraft() {
            const patch = await request(contentUrl, {
              method: 'PATCH',
              body: JSON.stringify(fields),
            });
            if (!patch.response.ok) throw new Error(formatError('Draft PATCH failed', patch));

            const publish = await request(`${managementUrl}/status`, {
              method: 'PATCH',
              body: JSON.stringify({ status: ['PUBLISH'] }),
            });
            if (!publish.response.ok) throw new Error(formatError('Draft publication failed', publish));
          }

          async function discardDraftAfterPublishedUpdate() {
            const result = await request(`${managementUrl}/status`, {
              method: 'PATCH',
              body: JSON.stringify({ status: ['PUBLISH'] }),
            });
            if (!result.response.ok) throw new Error(formatError('Draft discard failed', result));
          }

          async function upsertPublished() {
            const current = await request(contentUrl, { method: 'GET' });

            if (current.response.ok) {
              if (current.body?.title && current.body.title !== expectedTitle) {
                throw new Error(`Refusing to overwrite content with another title: ${current.body.title}`);
              }
              await patchPublished();
              try {
                const statuses = await managementStatus();
                if (statuses.includes('PUBLISH_AND_DRAFT') || (statuses.includes('PUBLISH') && statuses.includes('DRAFT'))) {
                  await discardDraftAfterPublishedUpdate();
                }
              } catch (error) {
                console.warn(`Management status cleanup skipped: ${error.message}`);
              }
              return 'updated';
            }

            if (current.response.status !== 404) {
              throw new Error(formatError('Initial content lookup failed', current));
            }

            const created = await request(contentUrl, {
              method: 'PUT',
              body: JSON.stringify(fields),
            });
            if (created.response.status === 201) return 'created';
            if (![400, 409].includes(created.response.status)) {
              throw new Error(formatError('Published-content PUT failed', created));
            }

            let statuses;
            try {
              statuses = await managementStatus();
            } catch {
              throw new Error(formatError('Published-content PUT failed', created));
            }
            if (statuses.includes('DRAFT') && !statuses.includes('PUBLISH')) {
              await publishDraft();
              return 'published-existing-draft';
            }
            if (statuses.includes('PUBLISH')) {
              await patchPublished();
              if (statuses.includes('DRAFT') || statuses.includes('PUBLISH_AND_DRAFT')) {
                await discardDraftAfterPublishedUpdate();
              }
              return 'updated-after-conflict';
            }
            throw new Error(`Unsupported existing microCMS status: ${JSON.stringify(statuses)}`);
          }

          async function verifyPublished() {
            let last = null;
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const result = await request(`${contentUrl}?fields=id,title,content,description,category,publishedAt,revisedAt`, {
                method: 'GET',
                headers: { 'Cache-Control': 'no-cache' },
              });
              last = result;
              if (
                result.response.ok &&
                result.body?.id === contentId &&
                result.body?.title === expectedTitle &&
                String(result.body?.content || '').includes(expectedPhrase) &&
                result.body?.category === fields.category &&
                result.body?.publishedAt
              ) {
                return result.body;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            throw new Error(formatError('Published-content verification failed', last));
          }

          (async () => {
            const operation = await upsertPublished();
            const published = await verifyPublished();
            console.log(JSON.stringify({
              operation,
              id: published.id,
              title: published.title,
              category: published.category,
              publishedAt: published.publishedAt,
              revisedAt: published.revisedAt,
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
