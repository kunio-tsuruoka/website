name: Requirements rewrite branch validation

on:
  push:
    branches:
      - content/requirements-rewrite-2026-08-19
    paths-ignore:
      - 'reports/requirements-rewrite-ci.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/requirements-rewrite-2026-08-19
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Format rewrite files with Biome
        shell: bash
        run: |
          bunx biome check --write \
            src/lib/requirements-content-upgrades.js \
            src/lib/requirements-content-upgrades.test.js \
            scripts/rewrite-requirements-content-2026-08-19.mjs \
            'src/pages/column/[...slug].astro'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/requirements-content-upgrades.js src/lib/requirements-content-upgrades.test.js scripts/rewrite-requirements-content-2026-08-19.mjs 'src/pages/column/[...slug].astro'
          git commit -m "style: format requirements rewrite [skip ci]" || true
          git push origin HEAD:content/requirements-rewrite-2026-08-19

      - name: Run repository validation
        shell: bash
        run: |
          set +e
          mkdir -p reports
          : > reports/requirements-rewrite-ci.txt
          for cmd in "bun run check:ci" "bun run test:ci" "bun run build"; do
            echo "=== $cmd ===" | tee -a reports/requirements-rewrite-ci.txt
            bash -lc "$cmd" 2>&1 | tee -a reports/requirements-rewrite-ci.txt
            status=${PIPESTATUS[0]}
            echo "exit_code=$status" | tee -a reports/requirements-rewrite-ci.txt
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          echo "route_diff:" | tee -a reports/requirements-rewrite-ci.txt
          git fetch origin main
          git diff origin/main -- 'src/pages/column/[...slug].astro' | tee -a reports/requirements-rewrite-ci.txt
          git add reports/requirements-rewrite-ci.txt
          git commit -m "chore: record requirements rewrite CI [skip ci]" || true
          git push origin HEAD:content/requirements-rewrite-2026-08-19
          test -z "$failed"
