name: Requirements rewrite branch validation

on:
  push:
    branches:
      - content/requirements-rewrite-2026-08-19
    paths-ignore:
      - 'reports/requirements-rewrite-ci.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/requirements-rewrite-2026-08-19
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore column route and apply minimal hook
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- 'src/pages/column/[...slug].astro'
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/column/[...slug].astro')
          text = path.read_text()
          import_anchor = "} from '../../lib/microcms';\n"
          import_line = "import { upgradeRequirementsContent } from '../../lib/requirements-content-upgrades.js';\n"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          hook_anchor = "if (!column) {\n  return Astro.redirect('/404');\n}\n"
          hook = "\n// 既存のslug/title/description/categoryを維持し、対象6記事の本文だけを現在のBeekle実務へ更新する。\ncolumn.content = upgradeRequirementsContent(columnId, column.content || '');\n"
          if hook not in text:
              text = text.replace(hook_anchor, hook_anchor + hook, 1)
          path.write_text(text)
          PY

      - run: bun install --frozen-lockfile

      - name: Run repository validation
        shell: bash
        run: |
          set +e
          mkdir -p reports
          : > reports/requirements-rewrite-ci.txt
          for cmd in "bun run check:ci" "bun run test:ci" "bun run build"; do
            echo "=== $cmd ===" | tee -a reports/requirements-rewrite-ci.txt
            bash -lc "$cmd" 2>&1 | tee -a reports/requirements-rewrite-ci.txt
            status=${PIPESTATUS[0]}
            echo "exit_code=$status" | tee -a reports/requirements-rewrite-ci.txt
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          echo "route_diff:" | tee -a reports/requirements-rewrite-ci.txt
          git diff origin/main -- 'src/pages/column/[...slug].astro' | tee -a reports/requirements-rewrite-ci.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/pages/column/[...slug].astro' reports/requirements-rewrite-ci.txt
          git commit -m "fix: keep column route change minimal [skip ci]" || true
          git push origin HEAD:content/requirements-rewrite-2026-08-19
          test -z "$failed"
