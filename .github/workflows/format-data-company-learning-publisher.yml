name: Format data-company-learning publisher

on:
  push:
    branches:
      - ops/publish-data-company-learning-sensor-cloudflare-20260831

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/publish-data-company-learning-sensor-cloudflare-20260831
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only the temporary publisher files
        run: |
          bunx @biomejs/biome check --write \
            src/lib/publish-data-company-learning-sensor.ts \
            src/lib/publish-data-company-learning-sensor.test.ts \
            src/pages/api/internal/publish-data-company-learning-sensor-8c5e4f6a2d1b49c1a7e309d4478df6cd.ts
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lib/publish-data-company-learning-sensor.ts \
            src/lib/publish-data-company-learning-sensor.test.ts \
            src/pages/api/internal/publish-data-company-learning-sensor-8c5e4f6a2d1b49c1a7e309d4478df6cd.ts
          git commit -m "style: format temporary article publisher"
          git push
