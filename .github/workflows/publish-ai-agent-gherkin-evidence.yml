name: Publish AI Agent Gherkin Evidence Article

on:
  push:
    branches: [main]
    paths:
      - src/pages/api/ops/publish-ai-agent-gherkin-evidence-0939d3d7358d45cab3cdce4327bb3003.ts
      - .github/workflows/publish-ai-agent-gherkin-evidence.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke the signed one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          publish_url='https://beekle.jp/api/ops/publish-ai-agent-gherkin-evidence-0939d3d7358d45cab3cdce4327bb3003?confirm=publish&token=Fthi_bnJUYh3YXRwh9_ZmRsMwnc0-r9l2qJMsExpUbI'

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --location \
              --output /tmp/publish-result.json \
              --write-out '%{http_code}' \
              "$publish_url" || true)"
            body="$(head -c 1000 /tmp/publish-result.json 2>/dev/null || true)"
            echo "publish attempt=${attempt} status=${status} body=${body}"

            if [[ "$status" == '200' ]] && grep -q '"ok":true' /tmp/publish-result.json; then
              break
            fi

            if [[ "$attempt" == '60' ]]; then
              echo 'Publisher did not become available or did not complete successfully.' >&2
              exit 1
            fi

            sleep 5
          done

      - name: Verify the public article
        shell: bash
        run: |
          set -euo pipefail
          article_url='https://beekle.jp/column/ai-agent-gherkin-evidence'

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location \
              --output /tmp/article.html \
              --write-out '%{http_code}' \
              "$article_url" || true)"

            if [[ "$status" == '200' ]] && grep -q 'AIエージェントに実装を任せるなら' /tmp/article.html; then
              echo "verified article_url=${article_url} status=${status}"
              exit 0
            fi

            echo "verify attempt=${attempt} status=${status}"
            sleep 2
          done

          echo 'The article was published but the public page could not be verified.' >&2
          exit 1
