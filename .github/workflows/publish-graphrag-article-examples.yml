name: Publish GraphRAG article examples

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-graphrag-article-examples.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the published article page
        env:
          ARTICLE_URL: https://beekle.jp/blog/small-internal-rag-without-vector-db
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output article.html \
            "$ARTICLE_URL"

          grep -F '「似ている」ではなく「どうつながっている」を聞く仕事がある' article.html
          grep -F '不良部品から、回収すべき製品と顧客までたどる' article.html
          grep -F '法改正から、直すべき規程・画面・研修資料までたどる' article.html
          grep -F 'システム障害から、原因となった変更までたどる' article.html
          grep -F '一件ずつ見ると普通な不正利用を、つながりで見つける' article.html
          grep -F '大型の法人営業で、意思決定のつながりをたどる' article.html
          grep -F 'PM on Railsでは、検索より関係の方が難しい' article.html
