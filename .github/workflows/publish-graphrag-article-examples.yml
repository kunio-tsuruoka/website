name: Publish GraphRAG article examples

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-graphrag-article-examples.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update and verify the published article
        env:
          UPDATE_URL: https://beekle.jp/api/ops/update-small-rag-graphrag-examples-545a918ef1539e3a
        run: |
          set -euo pipefail

          status="$(curl --silent --show-error --location \
            --output response.json \
            --write-out '%{http_code}' \
            "$UPDATE_URL" || true)"

          echo "status=$status"
          cat response.json 2>/dev/null || true

          [ "$status" = "200" ]
          jq -e '
            (.ok == true) and
            (.headingCount == 1) and
            (.productExampleVerified == true) and
            (.regulationExampleVerified == true) and
            (.fraudExampleVerified == true) and
            (.boundaryVerified == true) and
            (.pmOnRailsVerified == true)
          ' response.json >/dev/null
