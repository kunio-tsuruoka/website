name: Format AI adoption blog publisher

on:
  push:
    branches:
      - content/publish-ai-adoption-leadership-blogs-20260829
    paths:
      - scripts/publish-ai-adoption-blogs.mjs
      - tests/publish-ai-adoption-blogs.test.ts
      - .github/workflows/format-ai-adoption-blogs.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/publish-ai-adoption-leadership-blogs-20260829
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply Biome formatting
        run: bun x biome format --write scripts/publish-ai-adoption-blogs.mjs tests/publish-ai-adoption-blogs.test.ts
      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-ai-adoption-blogs.mjs tests/publish-ai-adoption-blogs.test.ts
          git diff --cached --quiet || git commit -m "style: format AI adoption blog publisher"
          git push origin HEAD:content/publish-ai-adoption-leadership-blogs-20260829
