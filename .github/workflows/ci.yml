name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cta_fix:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fix: normalize blog CTA dto3f38226f')
    name: One-off blog CTA repair
    runs-on: ubuntu-latest
    steps:
      - name: Compare working markup, repair target, and verify
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const reportPr = 136;
          const markers = ['AI_DEV_SERVICE_BRIDGE', 'CONTACT_CTA'];
          const domain = process.env.MICROCMS_SERVICE_DOMAIN;
          const apiKey = process.env.MICROCMS_API_KEY;
          if (!domain || !apiKey) throw new Error('microCMS secrets are unavailable');

          const base = `https://${domain}.microcms.io/api/v1`;
          const readHeaders = { 'X-MICROCMS-API-KEY': apiKey };
          const writeHeaders = { ...readHeaders, 'content-type': 'application/json' };
          const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const token = (m) => `{{${m}}}`;
          const wrappedRe = (m, flags = '') => new RegExp(`<p>\\s*${esc(token(m))}\\s*</p>`, flags);
          const lineRe = (m, flags = '') => new RegExp(`(^|\\r?\\n)[ \\t]*${esc(token(m))}[ \\t]*(?=\\r?\\n|$)`, flags);

          const getJson = async (url) => {
            const res = await fetch(url, { headers: readHeaders });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
            return res.json();
          };

          const postComment = async (payload) => {
            const body = `CTA_REPAIR_RESULT\n\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``;
            const res = await fetch(`https://api.github.com/repos/${process.env.GH_REPO}/issues/${reportPr}/comments`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ body }),
            });
            if (!res.ok) console.error(`Could not post report comment: ${res.status} ${await res.text()}`);
          };

          const snippet = (str, m) => {
            const t = token(m);
            const i = str.indexOf(t);
            if (i < 0) return null;
            return str.slice(Math.max(0, i - 100), Math.min(str.length, i + t.length + 100)).replace(/\n/g, '\\n');
          };

          const findStrings = (value, m, path = '$', out = []) => {
            if (typeof value === 'string') {
              if (value.includes(token(m))) out.push({ path, value });
              return out;
            }
            if (Array.isArray(value)) {
              value.forEach((v, i) => findStrings(v, m, `${path}[${i}]`, out));
              return out;
            }
            if (value && typeof value === 'object') {
              for (const [k, v] of Object.entries(value)) findStrings(v, m, `${path}.${k}`, out);
            }
            return out;
          };

          const validateTargetString = (str, m) => {
            const t = token(m);
            const total = str.split(t).length - 1;
            const withoutWrapped = str.replace(wrappedRe(m, 'g'), '');
            const remaining = withoutWrapped.split(t).length - 1;
            const standalone = [...withoutWrapped.matchAll(lineRe(m, 'g'))].length;
            return { total, remaining, standalone, valid: remaining === standalone };
          };

          const transform = (value, m) => {
            if (typeof value === 'string') {
              if (!value.includes(token(m))) return value;
              const check = validateTargetString(value, m);
              if (!check.valid) {
                throw new Error(`Unexpected non-standalone ${m} occurrence`);
              }
              const sentinel = `__CTA_${m}_${Date.now()}__`;
              let next = value.replace(wrappedRe(m, 'g'), sentinel);
              next = next.replace(lineRe(m, 'g'), (_match, prefix) => `${prefix}<p>${token(m)}</p>`);
              return next.replaceAll(sentinel, `<p>${token(m)}</p>`);
            }
            if (Array.isArray(value)) return value.map((v) => transform(v, m));
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, transform(v, m)]));
            }
            return value;
          };

          const report = { status: 'starting', working: {}, before: {}, updatedFields: [], after: {} };
          try {
            let offset = 0;
            while (Object.keys(report.working).length < markers.length) {
              const page = await getJson(`${base}/columns?limit=100&offset=${offset}&fields=id%2Ccontent`);
              for (const article of page.contents) {
                for (const m of markers) {
                  if (report.working[m]) continue;
                  if (typeof article.content === 'string' && article.content.includes(token(m))) {
                    report.working[m] = {
                      id: article.id,
                      wrapped: wrappedRe(m).test(article.content),
                      snippet: snippet(article.content, m),
                    };
                  }
                }
              }
              offset += page.contents.length;
              if (offset >= page.totalCount || page.contents.length === 0) break;
            }

            for (const m of markers) {
              if (!report.working[m]) throw new Error(`No working column example found for ${m}`);
              if (!report.working[m].wrapped) throw new Error(`Working column does not wrap ${m} in <p>`);
            }

            const before = await getJson(`${base}/blogs/dto3f38226f`);
            for (const m of markers) {
              report.before[m] = findStrings(before, m).map(({ path, value }) => ({
                path,
                check: validateTargetString(value, m),
                snippet: snippet(value, m),
              }));
              if (!report.before[m].length) throw new Error(`Target blog does not contain ${m}`);
              if (report.before[m].some((h) => !h.check.valid)) throw new Error(`Target has unsafe ${m} placement`);
            }

            let next = before;
            for (const m of markers) next = transform(next, m);
            const systemFields = new Set(['id', 'createdAt', 'updatedAt', 'publishedAt', 'revisedAt']);
            const patch = {};
            for (const [k, v] of Object.entries(next)) {
              if (systemFields.has(k)) continue;
              if (JSON.stringify(v) !== JSON.stringify(before[k])) patch[k] = v;
            }
            report.updatedFields = Object.keys(patch);
            if (!report.updatedFields.length) throw new Error('No fields changed; refusing no-op repair');

            const patchRes = await fetch(`${base}/blogs/dto3f38226f`, {
              method: 'PATCH',
              headers: writeHeaders,
              body: JSON.stringify(patch),
            });
            if (!patchRes.ok) throw new Error(`microCMS PATCH failed: ${patchRes.status} ${await patchRes.text()}`);

            const after = await getJson(`${base}/blogs/dto3f38226f`);
            for (const m of markers) {
              report.after[m] = findStrings(after, m).map(({ path, value }) => ({
                path,
                wrapped: wrappedRe(m).test(value),
                snippet: snippet(value, m),
              }));
              if (!report.after[m].length || report.after[m].some((h) => !h.wrapped)) {
                throw new Error(`Verification failed for ${m}`);
              }
            }
            report.status = 'repaired-and-verified';
            await postComment(report);
            console.log(JSON.stringify(report, null, 2));
          } catch (error) {
            report.status = 'failed-without-confirmed-repair';
            report.error = error instanceof Error ? error.message : String(error);
            await postComment(report);
            console.error(JSON.stringify(report, null, 2));
            throw error;
          }
          NODE

  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:ci

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:ci

  build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
