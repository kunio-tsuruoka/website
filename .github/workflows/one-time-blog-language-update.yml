name: One-time blog language update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-blog-language-update.yml

permissions:
  contents: read

jobs:
  update-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call the protected MCP updater after the site deployment
        env:
          UPDATE_URL: https://beekle.jp/api/ops/update-blog-language-7669e2603b4b6ccc256915f36019b211?token=7bzBuPiiuZGGjRuaGQqYuNAE_HdEYi-sKtWH7NXmqeg
        run: |
          set -euo pipefail
          : > response.txt
          for attempt in $(seq 1 36); do
            status="$(curl -sS --connect-timeout 10 --max-time 60 -o response.txt -w '%{http_code}' "$UPDATE_URL" || true)"
            if [ "$status" = "302" ]; then
              echo "MCP updater returned 302 after verifying the published MicroCMS content."
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status"
            head -c 800 response.txt || true
            echo
            sleep 15
          done
          echo "The updater did not report success."
          cat response.txt || true
          exit 1
