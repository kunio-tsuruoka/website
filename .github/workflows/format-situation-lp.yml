name: Format situation LP changes

on:
  push:
    branches:
      - feat/situation-lp-proof-content
    paths:
      - .github/workflows/format-situation-lp.yml
      - src/data/situation-lp-content.ts
      - src/data/situation-lp-content.test.ts
      - src/pages/situations/[slug].astro

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/situation-lp-proof-content
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed files and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          bun x biome format --write \
            src/data/situation-lp-content.ts \
            src/data/situation-lp-content.test.ts \
            'src/pages/situations/[slug].astro'
          git rm .github/workflows/format-situation-lp.yml
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/situation-lp-content.ts \
            src/data/situation-lp-content.test.ts \
            'src/pages/situations/[slug].astro'
          git commit -m 'style: format situation LP changes'
          git push origin HEAD:feat/situation-lp-proof-content
