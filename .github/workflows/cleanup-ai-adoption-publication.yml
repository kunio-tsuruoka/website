name: Cleanup one-off AI adoption publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-ai-adoption-publication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify published articles before cleanup
        shell: bash
        run: |
          set -euo pipefail

          management_body="$(
            curl -fsSL \
              -H 'Cache-Control: no-cache' \
              "https://beekle.jp/blog/ai-adoption-management-led?cleanup=${GITHUB_SHA}"
          )"
          operator_body="$(
            curl -fsSL \
              -H 'Cache-Control: no-cache' \
              "https://beekle.jp/blog/ai-adoption-person-in-charge?cleanup=${GITHUB_SHA}"
          )"

          grep -Fq 'AI導入を担当者に丸投げしても、たぶん進まない' <<< "$management_body"
          grep -Fq '/blog/ai-adoption-person-in-charge' <<< "$management_body"
          grep -Fq 'AI導入を丸投げされた担当者へ。整理されていなくても、全部持ってきてください' <<< "$operator_body"
          grep -Fq '自分は経営者であり、エンジニアでもあります' <<< "$operator_body"
          grep -Fq '会社そのものが学習し、判断し、改善できる状態' <<< "$operator_body"
          grep -Fq '/contact' <<< "$operator_body"
      - name: Remove one-off publication files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/cleanup-ai-adoption-publication.yml \
            .github/workflows/publish-ai-adoption-blogs.yml \
            scripts/publish-ai-adoption-blogs.mjs \
            tests/publish-ai-adoption-blogs.test.ts \
            src/data/ai-adoption-blogs.mjs \
            src/pages/api/internal/publish-ai-adoption-blogs-20260829.ts
          git commit -m 'chore: remove one-off AI adoption publisher'
          git push origin HEAD:main
