name: Publish AI adoption leadership blogs

on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/publish-ai-adoption-blogs.mjs
      - tests/publish-ai-adoption-blogs.test.ts
      - .github/workflows/publish-ai-adoption-blogs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'content: publish AI adoption leadership blogs')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate blog publication data
        run: bun x vitest run tests/publish-ai-adoption-blogs.test.ts
      - name: Verify Cloudflare production publication
        shell: bash
        run: |
          set -euo pipefail

          management_title='AI導入を担当者に丸投げしても、たぶん進まない'
          operator_title='AI導入を丸投げされた担当者へ。整理されていなくても、全部持ってきてください'

          for attempt in $(seq 1 120); do
            management_body="$(
              curl -fsSL \
                -H 'Cache-Control: no-cache' \
                "https://beekle.jp/blog/ai-adoption-management-led?verify=${GITHUB_SHA}-${attempt}" \
                || true
            )"
            operator_body="$(
              curl -fsSL \
                -H 'Cache-Control: no-cache' \
                "https://beekle.jp/blog/ai-adoption-person-in-charge?verify=${GITHUB_SHA}-${attempt}" \
                || true
            )"

            if grep -Fq "$management_title" <<< "$management_body" \
              && grep -Fq "$operator_title" <<< "$operator_body"; then
              echo 'verified https://beekle.jp/blog/ai-adoption-management-led'
              echo 'verified https://beekle.jp/blog/ai-adoption-person-in-charge'
              exit 0
            fi

            sleep 5
          done

          echo 'Cloudflare production publication was not visible on both URLs.' >&2
          exit 1
