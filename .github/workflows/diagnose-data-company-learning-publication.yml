name: Verify article and publication endpoint removal

on:
  push:
    branches:
      - ops/diagnose-data-company-learning-publication-20260831
    paths:
      - .github/workflows/diagnose-data-company-learning-publication.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the published article page
        shell: bash
        run: |
          set -euo pipefail
          article='https://beekle.jp/column/data-company-learning-sensor'
          status="$(curl --silent --show-error --location \
            --output article.html \
            --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' \
            "$article")"
          echo "ARTICLE_HTTP_STATUS=$status"
          test "$status" = '200'
          grep -Fq 'データは、会社が現実から学ぶためのセンサーだ' article.html
          grep -Fq 'BigQueryやDatabricksへ接続するのは、アプリの本番データベース' article.html
          grep -Fq 'データは、報告書を作るためにあるのではない。会社が現実から学び続けるためにある。' article.html
          echo "VERIFIED_URL=$article"

      - name: Verify the one-shot publication endpoint has been removed
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://beekle.jp/api/internal/publish-data-company-learning-sensor-8c5e4f6a2d1b49c1a7e309d4478df6cd'
          status="$(curl --silent --show-error --location \
            --output endpoint-response.txt \
            --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' \
            "$endpoint")"
          echo "REMOVED_ENDPOINT_HTTP_STATUS=$status"
          test "$status" = '404'
