name: Verify data-company-learning public article

on:
  push:
    branches:
      - ops/diagnose-data-company-learning-publication-20260831
    paths:
      - .github/workflows/diagnose-data-company-learning-publication.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the published article page
        shell: bash
        run: |
          set -euo pipefail
          article='https://beekle.jp/column/data-company-learning-sensor'
          status="$(curl --silent --show-error --location \
            --output article.html \
            --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' \
            "$article")"
          echo "HTTP_STATUS=$status"
          test "$status" = '200'
          grep -Fq 'データは、会社が現実から学ぶためのセンサーだ' article.html
          grep -Fq 'BigQueryやDatabricksへ接続するのは、アプリの本番データベース' article.html
          grep -Fq 'データは、報告書を作るためにあるのではない。会社が現実から学び続けるためにある。' article.html
          echo "VERIFIED_URL=$article"
