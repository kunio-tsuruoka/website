name: Inspect blog CTA markup

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compare working column CTA markup with target blog
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          cat > /tmp/inspect-cta.mjs <<'EOF'
          import { createClient } from 'microcms-js-sdk';
          import { writeFile } from 'node:fs/promises';

          const client = createClient({
            serviceDomain: process.env.MICROCMS_SERVICE_DOMAIN,
            apiKey: process.env.MICROCMS_API_KEY,
          });
          if (!process.env.MICROCMS_SERVICE_DOMAIN || !process.env.MICROCMS_API_KEY) {
            throw new Error('microCMS secrets are unavailable');
          }

          const markers = ['AI_DEV_SERVICE_BRIDGE', 'CONTACT_CTA'];
          const tokens = Object.fromEntries(markers.map((m) => [m, `{{${m}}}`]));

          function collectStringHits(value, token, path = '$', out = []) {
            if (typeof value === 'string') {
              if (value.includes(token)) {
                let start = 0;
                const snippets = [];
                while (true) {
                  const i = value.indexOf(token, start);
                  if (i < 0) break;
                  snippets.push(value.slice(Math.max(0, i - 140), Math.min(value.length, i + token.length + 140)).replace(/\n/g, '\\n'));
                  start = i + token.length;
                }
                out.push({ path, snippets });
              }
              return out;
            }
            if (Array.isArray(value)) {
              value.forEach((v, i) => collectStringHits(v, token, `${path}[${i}]`, out));
              return out;
            }
            if (value && typeof value === 'object') {
              for (const [k, v] of Object.entries(value)) collectStringHits(v, token, `${path}.${k}`, out);
            }
            return out;
          }

          let offset = 0;
          const working = {};
          while (Object.keys(working).length < markers.length) {
            const page = await client.get({ endpoint: 'columns', queries: { limit: 100, offset, fields: 'id,content' } });
            for (const article of page.contents) {
              for (const marker of markers) {
                if (working[marker]) continue;
                const hits = collectStringHits(article.content, tokens[marker]);
                if (hits.length) working[marker] = { id: article.id, hits };
              }
            }
            offset += page.contents.length;
            if (offset >= page.totalCount || page.contents.length === 0) break;
          }

          const target = await client.get({ endpoint: 'blogs', contentId: 'dto3f38226f' });
          const targetHits = {};
          for (const marker of markers) {
            targetHits[marker] = collectStringHits(target, tokens[marker]);
          }

          await writeFile('/tmp/cta-inspection.json', JSON.stringify({ working, targetHits }, null, 2));
          console.log(JSON.stringify({ working, targetHits }, null, 2));
          EOF
          bun /tmp/inspect-cta.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cta-inspection
          path: /tmp/cta-inspection.json
