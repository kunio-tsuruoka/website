name: Update AI Agent Gherkin Evidence Article

on:
  push:
    branches: [main]
    paths:
      - src/pages/api/ops/update-ai-agent-gherkin-evidence-20260829-7b83c1.ts
      - .github/workflows/update-ai-agent-gherkin-evidence.yml
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update the published article through Beekle MCP
        shell: bash
        run: |
          set -euo pipefail
          update_url='https://beekle.jp/api/ops/update-ai-agent-gherkin-evidence-20260829-7b83c1?confirm=publish&token=-ww5DR4HweEP1nh84g3Hwu9DL29ChimXirDdT2zm97o'

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --location \
              --output /tmp/update-result.json \
              --write-out '%{http_code}' \
              "$update_url" || true)"
            body="$(head -c 1500 /tmp/update-result.json 2>/dev/null || true)"
            echo "update attempt=${attempt} status=${status} body=${body}"

            if [[ "$status" == '200' ]] \
              && grep -q '"ok":true' /tmp/update-result.json \
              && grep -q '"via":"beekle_micro_cms.microcms_update_content"' /tmp/update-result.json; then
              break
            fi

            if [[ "$attempt" == '60' ]]; then
              echo 'The Beekle MCP-backed updater did not complete successfully.' >&2
              exit 1
            fi

            sleep 5
          done

      - name: Verify the public article
        shell: bash
        run: |
          set -euo pipefail
          article_url='https://beekle.jp/column/ai-agent-gherkin-evidence'

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location \
              --output /tmp/article.html \
              --write-out '%{http_code}' \
              "$article_url" || true)"

            if [[ "$status" == '200' ]] \
              && grep -q 'AIエージェントに実装を任せるなら' /tmp/article.html \
              && grep -q '本の原則を、AIエージェントが実装とテストを行う現在の開発環境に合わせて拡張' /tmp/article.html; then
              echo "verified article_url=${article_url} status=${status}"
              exit 0
            fi

            echo "verify attempt=${attempt} status=${status}"
            sleep 2
          done

          echo 'The article update was not visible on the public page.' >&2
          exit 1
